worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_max_body_size 1m;
    server_tokens off;

    upstream cabinet_upstream {
        server cabinet:8080;
    }

    upstream api_upstream {
        server api:8080;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name ledgesec.com www.ledgesec.com;

        ssl_certificate /etc/ledgesec/tls/fullchain.pem;
        ssl_certificate_key /etc/ledgesec/tls/privkey.pem;

        location = /edge-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://cabinet_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
