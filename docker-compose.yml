# EU platform. Coolify in Russia deploys this file over SSH.
# Server proxy: Custom (None). Resource: Raw compose, no Coolify domain.
# Caddy owns host ports 80 and 443. Databases publish none.
# The New York edge is not in this file.

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    environment:
      POSTGRES_USER: ledgesec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ledgesec
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgesec -d ledgesec"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    build:
      context: .
      dockerfile: deploy/clickhouse/Dockerfile
    environment:
      CLICKHOUSE_USER: ledgesec
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ledgesec
    volumes:
      - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "ledgesec", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1 FROM ledgesec.events LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ledgesec
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ledgesec
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ledgesec
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ledgesec
      LEDGESEC_INGEST_SECRET: ${LEDGESEC_INGEST_SECRET:-}
      LEDGESEC_SESSION_SECRET: ${LEDGESEC_SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    environment:
      PORT: "8080"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  edge:
    build: ./edge
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-shmidtelson@gmail.com}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres:
  clickhouse:
  caddy_data:
  caddy_config:
