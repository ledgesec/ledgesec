# New York edge only. Do not give this file to Coolify.
# No Postgres, no ClickHouse, no cabinet, no API. The edge pulls a snapshot later.
# Always pass -p ledgesec-us so a European COMPOSE_PROJECT_NAME cannot capture this file.
# Publish 80 and 443 here. Leave US_EDGE_HTTP_PORT and US_EDGE_HTTPS_PORT unset.
# Leave CADDY_LOCAL_CERTS unset so Caddy obtains a certificate for us.ledgesec.com.

name: ledgesec-us

services:
  edge:
    build:
      context: ./edge
      args:
        CADDYFILE: Caddyfile.us
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-shmidtelson@gmail.com}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    ports:
      - "${US_EDGE_HTTP_PORT:-80}:80"
      - "${US_EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
